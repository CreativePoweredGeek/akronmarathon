{layout="_layouts/_page_wrapper"}
<header class="container-fluid position-relative max_page_width p-0 mb-5 mx-auto" style="height:90vh;">
    <picture>
        <source media="(max-width:576px)" srcset="{layout:smartphone_header_image}">
        <source media="(max-width:768px)" srcset="{layout:tablet_header_image}">
        <source media="(max-width:992px)" srcset="{layout:tablet_header_image}">
        <img src="{layout:desktop_header_image}" alt="Flowers" class="w-100 h-100 object-fit-cover position-absolute">
    </picture>
    <div class="container-fluid image-mask position-absolute h-100 top-0">
        <div class="container-xl h-100 top-0">
            <div class="row h-100 align-items-center">
                <div class="col-xl-9 mx-auto">
                    <div class="row">

                        <div class="col-6 col-md-4 col-xl-3 mx-auto mb-3">
                            <img src="{site_url}assets/images/25years-home.png" class="img-fluid"
                                alt="akron marathon 25 years">
                        </div>
                        <div class="col-10 mx-auto col-xl-9 text-white shadow-sm">
                            <h1 class="text-start text-white">{layout:main_head}</h1>
                            <p>The first 25 years built something extraordinary. Join us for this milestone race and
                                help carry that spirit into the next 25.</p>
                            <p class="headline-font fs-3">September 25, 2027</p>
                            <div class="mt-3">
                                <a href="https://raceroster.com/events/2026/113171/2026-firstenergy-akron-marathon-half-marathon-and-team-relay?_gl=1*ja6mxa*_gcl_au*MTc4MDgwMTg3My4xNzg1NjE2OTI0*_ga*MzcxNjIwNDIyLjE3ODU2MTY5MjQ.*_ga_L7LFLYNEDS*czE3ODg4MDM1NTgkbzU0JGcxJHQxNzg4ODAzNTYyJGo1NiRsMCRoMA..&_ga=2.151245297.931139864.1788799228-371620422.1785616924"
                                    class="btn btn-primary btn-cta mx-1 rounded-1 mb-3">Register</a>
                                <a href="{site_url}plan-your-stay/" class="btn btn-primary mx-1 rounded-1 mb-3">Plan Your
                                    Stay</a>
                                <a href="{site_url}race-series/akron-marathon/"
                                    class="btn btn-primary btn mx-1 rounded-1 mb-3">Learn More</a>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
<div class="p-5 pt-0">
    {layout:pagecontents}
    {layout:contents}
</div>
