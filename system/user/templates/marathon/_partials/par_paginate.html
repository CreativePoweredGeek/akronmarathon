{paginate}
<div class="col-lg-12 mb-3 mx-auto p-3 p-md-3 ">  
  {pagination_links page_padding="5"}
   <nav aria-label="Page navigation">
  <ul class="pagination rounded-0">
      {first_page}
        <li class="page-item"><a href="{pagination_url}" class="page-link" href="#"><i class="fas fa-backward"></i></a></li>
      {/first_page}

      {previous_page}
        <li class="page-item"><a href="{pagination_url}" class="page-link" href="#">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" style="fill: rgba(0, 0, 0, 1);transform: ;msFilter:;"><path d="M13.293 6.293 7.586 12l5.707 5.707 1.414-1.414L10.414 12l4.293-4.293z"></path></svg>

        </a></li>
      {/previous_page}

      {page}
        <li class="page-item"><a href="{pagination_url}" class="page-link {if current_page}active{/if}" href="#">{pagination_page_number}</a></li>
      {/page}

      {next_page}
        <li class="page-item"><a href="{pagination_url}" class="page-link" href="#">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" style="fill: rgba(0, 0, 0, 1);transform: ;msFilter:;"><path d="M10.707 17.707 16.414 12l-5.707-5.707-1.414 1.414L13.586 12l-4.293 4.293z"></path></svg>
        </a></li>
      {/next_page}

      {last_page}
        <li class="page-item"><a  href="{pagination_url}"class="page-link" href="#"><i class="fas fa-forward"></i></a></li>
      {/last_page}
    </ul>
</nav>
  {/pagination_links}
</div>
{/paginate}
